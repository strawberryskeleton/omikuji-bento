<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bento | Omikuji Bento</title>
    <link rel="stylesheet" href="./bento.css">
    <script src="./bento.js" defer></script>
</head>
<body>
    
    <!-- header -->
    <header>
        <!-- logo -->
        <h1>Omikuji Bento</h1>
        
        <!-- about page btn -->
        <a href="../about/about.html">
            <button>learn more</button>
        </a>
    </header>

    <main>
        <!-- bento grid -->
        <section id="bento-grid">

            <!-- sushi -->
            <div class="food food1">
                <div class="food-img">
                    <img src="./assets/sushi.png" alt="sushi" class="sushi1">
                    <img src="./assets/sushi.png" alt="sushi" class="sushi2">
                    <img src="./assets/sushi.png" alt="sushi" class="sushi3">
                    <img src="./assets/sushi.png" alt="sushi" class="sushi4">
                </div>
            </div>

            <!-- mochi -->
            <div class="food food2">
                <div class="food-img">
                    <img src="./assets/mochi.png" alt="mochi" class="mochi1">
                    <!-- <img src="./assets/mochi.png" alt="mochi" class="mochi2"> -->
                </div>
            </div>

            <!-- onigiri -->
            <div class="food food3">
                <div class="food-img">
                    <img src="./assets/onigiri.png" alt="onigiri" class="onigiri1">
                    <img src="./assets/onigiri.png" alt="onigiri" class="onigiri2">
                    <img src="./assets/onigiri.png" alt="onigiri" class="onigiri3">
                </div>
            </div>

            <!-- taiyaki -->
            <div class="food food4">
                <div class="food-img">
                    <img src="./assets/taiyaki.png" alt="taiyaki" class="taiyaki1">
                </div>
            </div>

            <!-- tamagoyaki -->
            <div class="food food5">
                <div class="food-img">
                    <img src="./assets/tamagoyaki.png" alt="tamagoyaki" class="tamagoyaki1">
                    <img src="./assets/tamagoyaki.png" alt="tamagoyaki" class="tamagoyaki2">
                </div>
            </div>

        </section>

        <!-- fortune scroll -->
        <section id="scroll">
            <div class="scroll-div">
                <p id="fortune-text">
                    Lorem ipsum dolor sit amet consectetur adipisicing elit. Quasi quia rerum nihil nulla repellendus officia culpa, nesciunt excepturi, numquam provident quis ea, error veritatis. Sed?
                </p>
            </div>
        </section>
    </main>

    <!-- footer -->
    <footer>
        <p>&copy; 2026 omikuji bento | made by <a href="https://github.com/strawberryskeleton">@strawberryskeleton</a></p>
    </footer>
</body>
</html>
